<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{base}}
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{robots}}
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF7EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1612" media="(prefers-color-scheme: dark)">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Akinyele Spelling Challenge 2026: Come, Spell to Excel and Shine!">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spelling Challenge">
<link rel="preload" href="assets/fonts/lora-var.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/fonts/poppins-regular.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/style.css?v={{cssV}}">
<script>{{themeInit}}</script>
{{jsonld}}
